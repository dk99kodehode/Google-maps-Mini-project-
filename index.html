<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOOGLE MAPS API</title>

    <!-------css styling-->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/button.css" />

    <!------scrips-->
    <script type="module" src="javascript/script.js"></script>
    <script type="module" src="javascript/categories.js"></script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>

  <body>
    <div class="top-content">
      <input type="text" id="search" placeholder="Search..." />
      <button class="categories-btn" id="hotel-btn">🏨Hotell</button>
      <button class="categories-btn" id="park-btn">🏞Park</button>
      <button class="categories-btn" id="rest-btn">🍽️Restaurant</button>
      <button class="categories-btn"  id="store-btn">🛍Butikk</button>
    </div>

    <!-----------map-------------->
    <div id="map"></div>

    <!-----------sidebar----------------->
    <div id="sidebar" class="sidebar-hidden">
      <button id="close-btn">X</button>
      <input type="text" class="search-side" placeholder="hello" />

      <!----informasjon-->
      <div id="sidebar-content">
        <h2 id="steds-navn">Hellu</h2>
        <p id="steds-adresse">adress</p>
        <p id="åpningstid">adress</p>
        <p id="kontakt">adress</p>
      </div>
    </div>
  </body>
</html>
